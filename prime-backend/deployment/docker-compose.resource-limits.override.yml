x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-high-nofile: &high-nofile
  nofile:
    soft: 65535
    hard: 65535

services:
  prime-postgres:
    logging: *default-logging

  prime-redis:
    logging: *default-logging

  prime-pgbouncer:
    ulimits: *high-nofile
    logging: *default-logging

  prime-migrate:
    logging: *default-logging

  prime-minio:
    ulimits: *high-nofile
    logging: *default-logging

  prime-minio-setup:
    logging: *default-logging

  prime-api:
    ulimits: *high-nofile
    logging: *default-logging

  prime-worker:
    ulimits: *high-nofile
    logging: *default-logging

  prime-postgres-backup:
    logging: *default-logging
    healthcheck:
      test:
        - CMD-SHELL
        - test -n "$$(find -L /backups/last -type f -name '*.sql.gz' -mtime -2 -print -quit 2>/dev/null)"
      interval: 1h
      timeout: 10s
      retries: 2
      start_period: 5m

  matrix-synapse:
    ulimits: *high-nofile
    logging: *default-logging

  prime-web:
    ulimits: *high-nofile
    logging: *default-logging
