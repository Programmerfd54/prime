name: backend-ci

on:
  push:
    paths:
      - "prime-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "prime-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prime-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app tools
      - run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prime-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt bandit pip-audit
      - run: bandit -q -r app -ll
      - run: pip-audit -r requirements.txt --strict
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: prime-backend
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: prime-backend
          push: false
          tags: prime-api:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: prime-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
