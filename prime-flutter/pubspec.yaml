name: prime
description: PRIME — децентрализованный групповой трекер привычек.
publish_to: "none"
version: 1.0.18+19

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.7.0
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.17
  flutter_secure_storage: ^10.3.1
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  video_player: ^2.10.0
  url_launcher: ^6.3.1
  # Dribbble-tier motion / glass / forms (pinned where pre-1.0)
  animations: ^2.2.0
  flutter_slidable: ^4.0.3
  lottie: ^3.5.1
  forui: 0.24.3
  bento_layout: ^0.2.0
  fl_chart: ^1.2.0
  shadcn_ui: ^0.56.0
  cupertino_icons: ^1.0.9
  flutter_animate: ^4.5.2
  flutter_timezone: ^4.1.0
  lucide_icons_flutter: ^3.0.9

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/illustrations/
    - assets/photos/
    - assets/photos/programs/
    - assets/avatars/demo/
    - assets/lottie/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
