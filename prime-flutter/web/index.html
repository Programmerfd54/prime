<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ПРАЙМ — групповой трекер привычек, отчётов и поддержки команды из 6 человек.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12101A">
  <meta name="color-scheme" content="dark">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ПРАЙМ">
  <meta property="og:title" content="ПРАЙМ — командный трекер привычек">
  <meta property="og:description" content="Соберите команду из 6, держите ритм 30 дней и закрывайте дни вместе.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="ru_RU">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ПРАЙМ — командный трекер привычек">
  <meta name="twitter:description" content="Соберите команду из 6, держите ритм 30 дней и закрывайте дни вместе.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ПРАЙМ">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ПРАЙМ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #12101A;
      overflow: hidden;
    }
    #prime-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: radial-gradient(ellipse at 50% 30%, #2A1F3D 0%, #12101A 70%);
      color: #F2F0F5;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }
    #prime-preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #prime-preloader .mark {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #8B5CF6, #D946EF);
      box-shadow: 0 12px 32px rgba(139, 92, 246, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: 0.04em;
    }
    #prime-preloader .label {
      font-size: 14px;
      opacity: 0.72;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #prime-preloader .bar {
      width: 160px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    #prime-preloader .bar > span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8B5CF6, #D946EF);
      animation: prime-slide 1.1s ease-in-out infinite;
    }
    @keyframes prime-slide {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(320%); }
    }
  </style>
</head>
<body>
  <div id="prime-preloader" aria-live="polite" aria-busy="true">
    <div class="mark">П</div>
    <div class="label">Загрузка ПРАЙМ</div>
    <div class="bar"><span></span></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('prime-preloader');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
