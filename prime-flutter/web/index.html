  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <title>ПРАЙМ</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0F0D14;
      overflow: hidden;
    }

    #prime-preloader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0F0D14;
      color: #F2F0F5;
      font-family: Manrope, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #prime-preloader::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 70% 45% at 88% 6%, rgba(62, 46, 96, 0.28) 0%, transparent 58%),
        radial-gradient(ellipse 55% 38% at 10% 18%, rgba(52, 38, 82, 0.18) 0%, transparent 52%),
        radial-gradient(ellipse 50% 35% at 72% 58%, rgba(45, 35, 68, 0.12) 0%, transparent 50%);
    }

    #prime-preloader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #prime-preloader .stage {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 32px;
    }

    #prime-preloader .mark {
      width: 76px;
      height: 76px;
    }

    #prime-preloader .wordmark {
      margin-top: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.32em;
      color: rgba(196, 181, 230, 0.88);
    }

    #prime-preloader .status {
      margin-top: 10px;
      font-size: 15px;
      font-weight: 500;
      line-height: 1.35;
      color: rgba(242, 240, 245, 0.42);
    }

    #prime-preloader .dots {
      margin-top: 36px;
      display: flex;
      gap: 6px;
    }

    #prime-preloader .dots span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #8B5CF6;
      opacity: 0.28;
      animation: prime-dot 1.4s ease-in-out infinite;
    }

    #prime-preloader .dots span:nth-child(2) { animation-delay: 0.16s; }
    #prime-preloader .dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes prime-dot {
      0%, 80%, 100% {
        opacity: 0.28;
        transform: scale(0.82);
      }
      40% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div id="prime-preloader" aria-live="polite" aria-busy="true">
    <div class="stage">
      <svg class="mark" viewBox="0 0 76 76" fill="none" aria-hidden="true">
        <circle cx="38" cy="38" r="34" fill="url(#prime-glow)" opacity="0.35"/>
        <circle cx="38" cy="38" r="27.5" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="2"/>
        <circle cx="38" cy="10.5" r="3.2" fill="#8B5CF6" fill-opacity="0.55"/>
        <circle cx="61.5" cy="25.5" r="3.2" fill="#8B5CF6" fill-opacity="0.55"/>
        <circle cx="61.5" cy="50.5" r="3.2" fill="#8B5CF6" fill-opacity="0.55"/>
        <circle cx="38" cy="65.5" r="3.2" fill="#8B5CF6" fill-opacity="0.55"/>
        <circle cx="14.5" cy="50.5" r="3.2" fill="#8B5CF6" fill-opacity="0.55"/>
        <circle cx="14.5" cy="25.5" r="3.2" fill="#8B5CF6" fill-opacity="0.55"/>
        <circle cx="38" cy="38" r="8.5" fill="url(#prime-core)"/>
        <defs>
          <radialGradient id="prime-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(38 38) rotate(90) scale(34)">
            <stop stop-color="#8B5CF6" stop-opacity="0.35"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
          </radialGradient>
          <radialGradient id="prime-core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(38 38) rotate(90) scale(8.5)">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.4"/>
          </radialGradient>
        </defs>
      </svg>
      <div class="wordmark">ПРАЙМ</div>
      <div class="status">Собираем ваш день…</div>
      <div class="dots" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <script src="prime_preloader.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
