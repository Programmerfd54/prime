services:
  prime-postgres:
    image: postgres:16-alpine
    container_name: prime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prime}
      POSTGRES_USER: ${POSTGRES_USER:-prime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - prime_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prime} -d ${POSTGRES_DB:-prime}"]
      interval: 10s
      timeout: 5s
      retries: 10

  prime-api:
    build: .
    container_name: prime-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prime}:${POSTGRES_PASSWORD}@prime-postgres:5432/${POSTGRES_DB:-prime}
    depends_on:
      prime-postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.prime-api.entrypoints=web-secure"
      - "traefik.http.routers.prime-api.middlewares=compression@file"
      - "traefik.http.routers.prime-api.rule=Host(`api.inpr1me.ru`)"
      - "traefik.http.routers.prime-api.tls=true"
      - "traefik.http.routers.prime-api.tls.certresolver=default"
      - "traefik.http.services.prime-api.loadbalancer.server.port=8080"
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  matrix-synapse:
    image: matrixdotorg/synapse:latest
    container_name: prime-matrix-synapse
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    networks:
      - default
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.prime-matrix.entrypoints=web-secure"
      - "traefik.http.routers.prime-matrix.middlewares=compression@file"
      - "traefik.http.routers.prime-matrix.rule=Host(`matrix.inpr1me.ru`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse/client`))"
      - "traefik.http.routers.prime-matrix.tls=true"
      - "traefik.http.routers.prime-matrix.tls.certresolver=default"
      - "traefik.http.services.prime-matrix.loadbalancer.server.port=8008"
    ports:
      - "8008:8008"
    volumes:
      - ./matrix:/data

  prime-web:
    image: nginx:alpine
    container_name: prime-web
    restart: unless-stopped
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.prime-web.entrypoints=web-secure"
      - "traefik.http.routers.prime-web.middlewares=compression@file"
      - "traefik.http.routers.prime-web.rule=Host(`app.inpr1me.ru`)"
      - "traefik.http.routers.prime-web.tls=true"
      - "traefik.http.routers.prime-web.tls.certresolver=default"
      - "traefik.http.services.prime-web.loadbalancer.server.port=80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web-nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  prime_postgres_data:

networks:
  traefik:
    external: true
