services:
  prime-postgres:
    image: postgres:16.14-alpine3.24
    restart: unless-stopped
    env_file: [./prime-backend/.env]
    volumes:
      - prime_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-prime} -d $${POSTGRES_DB:-prime}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  prime-redis:
    image: redis:8.2.8-alpine3.22
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - prime_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  prime-pgbouncer:
    image: edoburu/pgbouncer:v1.25.2-p0
    restart: unless-stopped
    env_file: [./prime-backend/.env]
    environment:
      DB_HOST: prime-postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-prime}
      DB_USER: ${POSTGRES_USER:-prime}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 30
      RESERVE_POOL_SIZE: 5
      MAX_PREPARED_STATEMENTS: 200
    depends_on:
      prime-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER:-prime} -d $${POSTGRES_DB:-prime}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  prime-migrate:
    build: ./prime-backend
    restart: "no"
    env_file: [./prime-backend/.env]
    command: ["python", "-m", "app.migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prime}:${POSTGRES_PASSWORD}@prime-postgres:5432/${POSTGRES_DB:-prime}
      DATABASE_USE_PGBOUNCER: "false"
      RUN_DB_MIGRATIONS: "true"
      RUN_BACKGROUND_WORKERS: "false"
    depends_on:
      prime-postgres:
        condition: service_healthy

  prime-api:
    build: ./prime-backend
    restart: unless-stopped
    env_file: [./prime-backend/.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prime}:${POSTGRES_PASSWORD}@prime-pgbouncer:5432/${POSTGRES_DB:-prime}
      DATABASE_USE_PGBOUNCER: "true"
      REDIS_URL: redis://prime-redis:6379/0
      RUN_DB_MIGRATIONS: "false"
      RUN_BACKGROUND_WORKERS: "false"
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    depends_on:
      prime-pgbouncer:
        condition: service_healthy
      prime-redis:
        condition: service_healthy
      prime-migrate:
        condition: service_completed_successfully
    networks: [default, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.prime-api.entrypoints=web-secure
      - traefik.http.routers.prime-api.middlewares=compression@file
      - traefik.http.routers.prime-api.rule=Host(`api.inpr1me.ru`)
      - traefik.http.routers.prime-api.tls=true
      - traefik.http.routers.prime-api.tls.certresolver=default
      - traefik.http.services.prime-api.loadbalancer.server.port=8080
    volumes:
      - ./prime-backend/logs:/app/logs
      - ./prime-backend/uploads:/app/uploads
      - ./prime-backend/secrets:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m

  prime-worker:
    build: ./prime-backend
    restart: unless-stopped
    env_file: [./prime-backend/.env]
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-prime}:${POSTGRES_PASSWORD}@prime-pgbouncer:5432/${POSTGRES_DB:-prime}
      DATABASE_USE_PGBOUNCER: "true"
      REDIS_URL: redis://prime-redis:6379/0
      RUN_DB_MIGRATIONS: "false"
      RUN_BACKGROUND_WORKERS: "false"
    depends_on:
      prime-pgbouncer:
        condition: service_healthy
      prime-redis:
        condition: service_healthy
      prime-migrate:
        condition: service_completed_successfully
    volumes:
      - ./prime-backend/logs:/app/logs
      - ./prime-backend/uploads:/app/uploads
      - ./prime-backend/secrets:/app/secrets:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m

  prime-postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine-d257e5d
    restart: unless-stopped
    env_file: [./prime-backend/.env]
    environment:
      POSTGRES_HOST: prime-postgres
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-14}
      BACKUP_DIR: /backups
    volumes:
      - prime_postgres_backups:/backups
    depends_on:
      prime-postgres:
        condition: service_healthy
    mem_limit: 128m

  matrix-synapse:
    image: matrixdotorg/synapse:v1.157.1
    profiles: [matrix]
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    networks: [default, traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.prime-matrix.entrypoints=web-secure
      - traefik.http.routers.prime-matrix.middlewares=compression@file
      - traefik.http.routers.prime-matrix.rule=Host(`matrix.inpr1me.ru`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse/client`))
      - traefik.http.routers.prime-matrix.tls=true
      - traefik.http.routers.prime-matrix.tls.certresolver=default
      - traefik.http.services.prime-matrix.loadbalancer.server.port=8008
    volumes:
      - ./prime-backend/matrix:/data

  prime-web:
    image: nginx:1.27.5-alpine3.21
    restart: unless-stopped
    networks: [traefik]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik
      - traefik.http.routers.prime-web.entrypoints=web-secure
      - traefik.http.routers.prime-web.middlewares=compression@file
      - traefik.http.routers.prime-web.rule=Host(`app.inpr1me.ru`)
      - traefik.http.routers.prime-web.tls=true
      - traefik.http.routers.prime-web.tls.certresolver=default
      - traefik.http.services.prime-web.loadbalancer.server.port=80
    volumes:
      - ./prime-flutter/build/web:/usr/share/nginx/html:ro
      - ./prime-web-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m

volumes:
  prime_postgres_data:
  prime_redis_data:
  prime_postgres_backups:

networks:
  traefik:
    external: true
